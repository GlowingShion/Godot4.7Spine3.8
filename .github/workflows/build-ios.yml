name: Build iOS (spine-godot 4.3 + Spine 3.8)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SCons (in a venv)
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/venv"
          "$GITHUB_WORKSPACE/venv/bin/python" -m pip install --upgrade pip scons
          echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"

      - name: Clone godot-cpp (pinned)
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git spine-godot/godot-cpp
          git -C spine-godot/godot-cpp fetch --depth 1 origin 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
          git -C spine-godot/godot-cpp checkout 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5

      - name: Build iOS device (arm64)
        run: |
          cd spine-godot
          scons platform=ios arch=arm64 target=template_debug api_version=4.7 ios_simulator=no --jobs=$(sysctl -n hw.logicalcpu)
          scons platform=ios arch=arm64 target=template_release api_version=4.7 ios_simulator=no --jobs=$(sysctl -n hw.logicalcpu)
          mkdir -p staged
          cp -R bin/ios/libspine_godot.ios.template_debug.framework staged/device-debug.framework
          cp -R bin/ios/libspine_godot.ios.template_release.framework staged/device-release.framework
          rm -rf bin/ios/*

      - name: Build iOS simulator (x86_64)
        run: |
          cd spine-godot
          scons platform=ios arch=x86_64 target=template_debug api_version=4.7 ios_simulator=yes --jobs=$(sysctl -n hw.logicalcpu)
          scons platform=ios arch=x86_64 target=template_release api_version=4.7 ios_simulator=yes --jobs=$(sysctl -n hw.logicalcpu)
          cp -R bin/ios/libspine_godot.ios.template_debug.framework staged/sim-debug.framework
          cp -R bin/ios/libspine_godot.ios.template_release.framework staged/sim-release.framework

      - name: Merge device + simulator into fat frameworks
        run: |
          cd spine-godot/staged
          for cfg in debug release; do
            out="libspine_godot.ios.template_${cfg}.framework"
            cp -R "device-${cfg}.framework" "$out"
            lipo -create -output "$out/libspine_godot.ios.template_${cfg}" \
              "device-${cfg}.framework/libspine_godot.ios.template_${cfg}" \
              "sim-${cfg}.framework/libspine_godot.ios.template_${cfg}"
            lipo -info "$out/libspine_godot.ios.template_${cfg}"
          done
          rm -rf device-debug.framework device-release.framework sim-debug.framework sim-release.framework
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spine-godot-ios
          path: spine-godot/staged/*.framework
